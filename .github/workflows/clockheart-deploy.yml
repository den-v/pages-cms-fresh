# Written by Clockheart. Builds the site whenever main changes — a client's
# save in Pages CMS or a Publish from Clockheart — and puts it live where the
# repo variable CLOCKHEART_HOST says: GitHub Pages ("github-pages") or Cloudflare
# ("cloudflare", with the key in the repo secret CLOUDFLARE_API_TOKEN).
name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.CLOCKHEART_HOST }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        if: ${{ vars.CLOCKHEART_HOST == 'github-pages' }}
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$HOST" = "github-pages" ]; then
            npx astro build --site "$SITE" --base "${BASE_PATH:-/}"
            node .github/clockheart-base.mjs dist "$BASE_PATH"
          else
            npx astro build
          fi
      - if: ${{ vars.CLOCKHEART_HOST == 'github-pages' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Put it live on Cloudflare
        if: ${{ vars.CLOCKHEART_HOST != 'github-pages' && env.CLOUDFLARE_API_TOKEN != '' }}
        # The commit id, never its message: a message is text anyone with write
        # access chose, and pasting it into a shell line would run it.
        run: npx --yes wrangler@4 deploy ./dist --name pages-cms-fresh --compatibility-date 2026-11-15 --message "${{ github.sha }}"
  pages:
    if: ${{ vars.CLOCKHEART_HOST == 'github-pages' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
